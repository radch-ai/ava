name: Release Go service image

# On v* tags, build and push an image for every allowed_services entry.
# Registry: ghcr.io/radch-ai/ava-<service>
# Image tags: :<version>, :latest
# Build: services/<service>/Dockerfile (multi-stage).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    name: Build service matrix
    uses: ./.github/workflows/service-matrix.yml

  release:
    name: Build and push
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.matrix.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read Go version from go.mod
        id: gover
        run: echo "version=$(awk '/^go /{print $2; exit}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/radch-ai/ava-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          build-args: |
            VERSION=${{ github.ref_name }}
            GO_VERSION=${{ steps.gover.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ${{ matrix.service }} released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
