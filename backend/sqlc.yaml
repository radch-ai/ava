version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/queries/"
    schema: "internal/schema/migrations/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: false
        overrides:
          - column: "agents.user_context"
            go_type: "database/sql.NullString"
          - column: "heartbeat.model"
            go_type: "database/sql.NullString"
          - column: "heartbeat.provider_id"
            go_type: "database/sql.NullString"
          - column: "cron_jobs.model"
            go_type: "database/sql.NullString"
          - column: "cron_jobs.provider_id"
            go_type: "database/sql.NullString"
          - column: "cron_jobs.cron_expression"
            go_type: "database/sql.NullString"
          - column: "agent_activity.message"
            go_type: "database/sql.NullString"
